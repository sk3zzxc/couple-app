  <style>
    :root{--berry:#B82952;--ink:#33252b;--muted:#987f88;--powder:#F4DCE3;--shadow:0 8px 24px rgba(149,117,128,.06)}*{box-sizing:border-box}html{background:#FAF7F7}body{min-height:100vh;background:linear-gradient(180deg,#FBECEF 0%,#FAF7F7 42%,#FAF7F7 100%);color:var(--ink);font-family:Manrope,ui-sans-serif,system-ui,sans-serif;font-weight:500;letter-spacing:-.01em}button,input{font:inherit}button{transition:all .2s ease}button:active{transform:scale(.96);opacity:.88}.page{min-height:100vh;padding-bottom:118px}.nav{padding:12px 12px max(14px,env(safe-area-inset-bottom));border:1px solid rgba(255,255,255,.72);border-bottom:0;border-radius:28px 28px 0 0;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 -8px 30px rgba(149,117,128,.08)}.hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{scrollbar-width:none}.heart-pulse{box-shadow:0 10px 26px rgba(184,41,82,.28);animation:pulse 2.8s infinite}@keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(184,41,82,.24)}50%{box-shadow:0 10px 34px rgba(184,41,82,.42)}}.toast{animation:toast .25s ease-out}.game-card{aspect-ratio:2/3;height:auto;width:62px;animation:deal .35s ease-out;transition:all .2s ease;box-shadow:0 7px 16px rgba(80,45,55,.1)}.game-card:hover{transform:translateY(-10px) rotate(-2deg);box-shadow:0 14px 22px rgba(80,45,55,.16)}@keyframes deal{from{transform:translateY(18px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}@keyframes toast{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}.rounded-\\[20px\\]{border-radius:24px!important}.shadow-soft{box-shadow:var(--shadow)!important}.bg-berry{background-color:var(--berry)!important}.text-berry{color:var(--berry)!important}.bg-\\[\\#f9e6eb\\],.bg-\\[\\#f7edef\\]{background-color:var(--powder)!important}.border-berry{border-color:var(--berry)!important}[data-lucide]{width:18px;height:18px;stroke-width:2;vertical-align:middle}
    body.dark{background:linear-gradient(180deg,#25181f 0%,#131012 48%,#131012 100%);color:#f4e9ed}body.dark .bg-white,body.dark .bg-white\/95{background:#1E191C!important}body.dark .text-\[\#927b82\],body.dark .text-\[\#9b8188\],body.dark .text-\[\#a58f95\],body.dark .text-\[\#b49da4\]{color:#A6969C!important}body.dark input,body.dark code{background:#282125!important;color:#f4e9ed}body.dark .nav{background:rgba(30,25,28,.85)}body.dark .bg-\[\#fff7f8\],body.dark .bg-\[\#fff6f7\],body.dark .bg-\[\#fdf0f3\]{background:#292125!important}body.dark .bg-\[\#f9e6eb\],body.dark .bg-\[\#f7edef\]{background:#39252d!important}body.dark .border-white{border-color:#1E191C!important}.theme-btn{display:flex;height:40px;width:40px;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.6);color:var(--berry)}body.dark .theme-btn{background:#302329;color:#f6ced9}.avatar-img{object-fit:cover}.love-heart{position:fixed;pointer-events:none;z-index:50;animation:floatHeart 1.2s ease-out forwards}@keyframes floatHeart{0%{transform:translateY(0) scale(.7);opacity:0}20%{opacity:1}100%{transform:translateY(-120px) translateX(var(--drift)) scale(1.2);opacity:0}
  </style>
</head>
<body>
  <div id="app" class="mx-auto min-h-screen max-w-xl"></div>
  <div id="toast" class="fixed bottom-28 left-1/2 z-50 hidden -translate-x-1/2 rounded-full bg-[#37262c] px-4 py-2 text-sm text-white shadow-lg"></div>
<script>
const SUPABASE_URL='https://ttmfyftblytlsmzukesk.supabase.co';
const SUPABASE_KEY='sb_publishable_14z1R07uloDUSZHxwoeoKw_PwqVP4uF';
const COUPLE_SECRET='skezz1488MQ';
const ALLOWED_IDS=[499383328,6085996678];
const tg=window.Telegram?.WebApp; tg?.ready();tg?.expand();
const userId=String(tg?.initDataUnsafe?.user?.id||'');
const meName=tg?.initDataUnsafe?.user?.first_name||'Я';
const accessGranted=!ALLOWED_IDS.length||ALLOWED_IDS.map(String).includes(userId);
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY,{global:{headers:{'x-couple-secret':COUPLE_SECRET}}});
const MATVEY_ID='499383328';
const KSUSHA_ID='6085996678';
const sweetMessages=['Я скучаю по тебе 💗','Ты мой самый любимый человек','Хочу скорее тебя обнять','Ты делаешь мой день теплее','Улыбнись, я думаю о тебе','Ты у меня самый лучший','Моё сердце сейчас рядом с тобой','Ты прекрасен даже когда уставший','С тобой всё становится уютнее','Я выбираю тебя каждый день','Ты моё любимое приключение','Отправляю тебе виртуальный поцелуй 💋','Без тебя день какой-то неполный','Ты мой дом','Горжусь тобой','Ты очень мне нужен','Спасибо, что ты есть','Хочу украсть тебя на свидание','Ты мой самый сладкий сюрприз','Скорее возвращайся ко мне'];
const fallbackRecipes=['Паста карбонара','Шакшука','Курица терияки','Сырники','Том ям','Пицца маргарита','Греческий салат','Борщ','Рамен','Тако','Лазанья','Плов','Овсянка с ягодами','Крем-суп из тыквы','Блины'];
const fallbackFilms=['Интерстеллар','1+1','Амели','Начало','Ла-Ла Ленд','Достучаться до небес','Гарри Поттер и философский камень','Иллюзия обмана','ВАЛЛ·И','Зелёная миля','Престиж','Вверх','Король говорит!','Паразиты','Шоу Трумана'];
const state={tab:'home',home:'shopping',wishlist:'mine',view:'watch',loading:true,items:[],recipes:[],wishlistItems:[],places:[],couple:null,gameMode:'bot',game:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const icon=(name,cls='')=>`<i data-lucide="${({home:'house',map:'map-pin',heart:'heart',gift:'gift',gear:'settings',plus:'plus',trash:'trash-2',check:'check',film:'clapperboard',shuffle:'shuffle',food:'utensils',spark:'sparkles'}[name]||name)}" class="${cls}"></i>`;
function toast(msg){const x=document.querySelector('#toast');x.textContent=msg;x.classList.remove('hidden');x.classList.add('toast');setTimeout(()=>x.classList.add('hidden'),1800)}
function dateNow(){return new Date().toISOString()}
function initTheme(){const saved=localStorage.getItem('couple-theme');const initial=saved||(tg?.colorScheme==='dark'?'dark':'light');document.body.classList.toggle('dark',initial==='dark')}
async function syncAvatar(){const url=tg?.initDataUnsafe?.user?.photo_url;if(!url||!state.couple?.id)return;const col=userId===MATVEY_ID?'matvey_avatar':'ksyusha_avatar';if(!state.couple[col])await update('couple_state',state.couple.id,{[col]:url,updated_at:dateNow()})}
async function load(){if(!accessGranted)return;state.loading=true;render();const tables=['items','recipes','wishlist','places','couple_state'];const res=await Promise.all(tables.map(t=>db.from(t).select('*').order(t==='couple_state'?'updated_at':'created_at',{ascending:false})));[state.items,state.recipes,state.wishlistItems,state.places,state.couple]=res.map((r,i)=>i===4?(r.data?.[0]||{}):(r.data||[]));if(state.couple?.durak_state)state.game=state.couple.durak_state;state.loading=false;render();syncAvatar()}
function subscribe(){if(!accessGranted)return;db.channel('couple-live').on('postgres_changes',{event:'*',schema:'public'},()=>load()).subscribe()}
async function add(table,payload){if(!accessGranted)return;const {error}=await db.from(table).insert(payload);if(error)toast(error.message);else{toast('Сохранено');load()}}
async function update(table,id,payload){if(!accessGranted)return;const {error}=await db.from(table).update(payload).eq('id',id);if(error)toast(error.message);else load()}
async function remove(table,id){if(!accessGranted)return;const {error}=await db.from(table).delete().eq('id',id);if(error)toast(error.message);else load()}
function card(body,cls=''){return `<section class="rounded-[20px] bg-white p-4 shadow-soft ${cls}">${body}</section>`}
function gameRanks(){return ['6','7','8','9','10','В','Д','К','Т']}
function makeDeck(){return ['♠️','♣️','♥️','♦️'].flatMap(s=>gameRanks().map((r,i)=>({id:r+s,suit:s,rank:r,value:i+6})))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function newGame(mode='bot'){let d=shuffle(makeDeck()),trump=d[d.length-1];state.game={mode,trump,deck:d.slice(0,-1),table:[],hands:{matvey:d.slice(0,6),ksusha:d.slice(6,12)},turn:'ksusha',message:'Ваш ход, Ксюша 💗'};saveGame();render()}
function startGame(mode){newGame(mode)}
function gameCard(c,owner){return `<button onclick="playCard('${c.id}','${owner}')" class="relative h-28 w-[62px] shrink-0 rounded-xl border-2 ${c.suit===state.game.trump.suit?'border-berry shadow-[0_0_0_2px_#f8c4d2]':'border-[#eadde0]'} bg-white p-2 text-left shadow-md ${(c.suit==='♥️'||c.suit==='♦️')?'text-[#d12e5a]':'text-[#30272a]'}"><b class="text-lg">${c.rank}</b><span class="absolute bottom-2 right-2 text-lg">${c.suit}</span></button>`}
function gameView(){const g=state.game;if(!g)return card(`<div class="text-center"><p class="mb-3 text-sm text-[#927b82]">Карточная игра для двоих</p><div class="flex gap-2"><button onclick="startGame('bot')" class="flex-1 rounded-2xl bg-berry py-3 text-sm font-bold text-white">🤵 Против бота</button><button onclick="startGame('online')" class="flex-1 rounded-2xl bg-[#37262c] py-3 text-sm font-bold text-white">📱 Вдвоём онлайн</button></div></div>`);const mine=userId===MATVEY_ID?'matvey':'ksusha';return card(`<div class="mb-3 flex items-center justify-between"><div><h2 class="font-extrabold">Подкидной Дурак</h2><p class="text-xs text-[#927b82]">Козырь: <b class="text-berry">${g.trump.suit}</b> · ${esc(g.message)}</p></div><button onclick="newGame('${g.mode}')" class="rounded-xl bg-[#f9e6eb] px-3 py-2 text-xs font-bold text-berry">Новая</button></div><div class="min-h-28 rounded-2xl bg-[#fdf0f3] p-3"><p class="mb-2 text-xs text-[#927b82]">Стол</p><div class="flex gap-2">${g.table.map(x=>`<div class="rounded-xl bg-white p-3 shadow">${x.rank}${x.suit}</div>`).join('')||'<span class="text-sm text-[#b49da4]">Карты появятся здесь</span>'}</div></div><p class="mt-3 text-xs text-[#927b82]">Твои карты · ${g.hands[mine].length}</p><div class="mt-2 flex gap-2 overflow-x-auto pb-2 hide-scroll">${g.hands[mine].map(c=>gameCard(c,mine)).join('')}</div>`)}
async function saveGame(){if(state.game&&state.couple?.id)await update('couple_state',state.couple.id,{durak_state:state.game,updated_at:dateNow()})}
function playCard(id,owner){const g=state.game;if(!g||g.turn!==owner)return;const i=g.hands[owner].findIndex(c=>c.id===id);if(i<0)return;g.table.push(g.hands[owner].splice(i,1)[0]);g.turn=owner==='ksusha'?'matvey':'ksusha';g.message=owner==='ksusha'?'Красиво! Так держать 💗':'Дерзкий ход, Матвей 😏';saveGame();render();if(g.mode==='bot'&&owner==='ksusha')setTimeout(()=>botPlay(),650)}
function botPlay(){const g=state.game;if(!g||g.turn!=='matvey')return;const c=g.hands.matvey.shift();if(c){g.table.push(c);g.turn='ksusha';g.message=Math.random()<.25?'Ладно, сегодня немного поддаюсь 😉':'Дворецкий ходит уверенно!';saveGame();render()}}
function statusBlock(){const p=state.couple||{};if(userId===MATVEY_ID)return card(`<h2 class="font-extrabold">Где Матвей? 📍</h2><p class="mt-2 text-sm">Сейчас: ${esc(p.matvey_status||'Статус не задан')}</p><div class="mt-3 flex flex-wrap gap-2">${['На паре 📚','В зале 💪','На смене 🌙','Сплю 😴'].map((s,i)=>`<button onclick="setStatusPreset(${i})" class="rounded-xl bg-[#f9e6eb] px-3 py-2 text-sm text-berry">${s}</button>`).join('')}</div><div class="mt-3 flex gap-2"><input id="status-input" class="min-w-0 flex-1 rounded-xl bg-[#fff7f8] px-3 py-2" placeholder="Свой статус…"><button onclick="setStatus(document.querySelector('#status-input').value)" class="rounded-xl bg-berry px-3 text-white">Сохранить</button></div>${p.last_sweet_msg?`<p class="mt-3 rounded-xl bg-[#fff0f3] p-3 text-sm text-berry">💌 ${esc(p.last_sweet_msg)}</p>`:''}`);return card(`<h2 class="font-extrabold">Где Матвей? 💌</h2><p class="mt-2 text-lg font-bold text-berry">${esc(p.matvey_status||'Статус пока неизвестен')}</p><div class="mt-3 flex gap-2"><button onclick="sweetCall()" class="flex-1 rounded-xl bg-berry px-3 py-3 text-sm font-bold text-white">💌 Позвать Матвея / Скучаю</button><button onclick="sweetCompliment()" class="rounded-xl bg-[#f9e6eb] px-3 py-3 text-sm text-berry">🎲 Получить комплимент</button></div>`)}
function sweetCompliment(){toast(sweetMessages[Math.floor(Math.random()*sweetMessages.length)])}
async function sweetCall(){const msg=sweetMessages[Math.floor(Math.random()*sweetMessages.length)];toast(msg);if(state.couple?.id)await update('couple_state',state.couple.id,{last_sweet_msg:msg,updated_at:dateNow()});else toast('Нет записи couple_state')}
async function setStatus(v){if(userId!==MATVEY_ID||!v?.trim())return;if(!state.couple?.id){toast('Нет записи couple_state');return}await update('couple_state',state.couple.id,{matvey_status:v.trim(),updated_at:dateNow()})}
function setStartDate(v){if(v&&state.couple?.id)update('couple_state',state.couple.id,{start_date:v,updated_at:dateNow()})}
function setStatusPreset(i){setStatus(['На паре 📚','В зале 💪','На смене 🌙','Сплю 😴'][i])}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('couple-theme',document.body.classList.contains('dark')?'dark':'light');render()}
function renamePet(){const v=prompt('Имя питомца',state.couple?.pet_name||'Бланшик');if(v?.trim()&&state.couple?.id)update('couple_state',state.couple.id,{pet_name:v.trim(),updated_at:dateNow()})}
function sendWarmth(e){tg?.HapticFeedback?.impactOccurred('medium');if(state.couple?.id)update('couple_state',state.couple.id,{love_taps:Number(state.couple.love_taps||0)+1,updated_at:dateNow()});for(let i=0;i<6;i++){const h=document.createElement('span');h.className='love-heart';h.textContent='♥';h.style.left=(e.clientX+(Math.random()*50-25))+'px';h.style.top=e.clientY+'px';h.style.color=['#B82952','#E0436E','#f19ab2'][i%3];h.style.setProperty('--drift',(Math.random()*80-40)+'px');document.body.appendChild(h);setTimeout(()=>h.remove(),1300)}}
function saveAvatar(file){if(!file||!state.couple?.id)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d'),s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;x.drawImage(img,sx,sy,s,s,0,0,200,200);const col=userId===MATVEY_ID?'matvey_avatar':'ksyusha_avatar';update('couple_state',state.couple.id,{[col]:c.toDataURL('image/jpeg',.82),updated_at:dateNow()})};img.src=URL.createObjectURL(file)}
function header(title,sub=''){return `<header class="flex items-center justify-between px-5 pb-5 pt-8"><div><h1 class="text-[25px] font-extrabold tracking-[-.04em]">${title}</h1>${sub?`<p class="mt-1 text-sm text-[#927b82]">${sub}</p>`:''}</div><div class="flex items-center gap-2"><button onclick="toggleTheme()" class="theme-btn">${icon(document.body.classList.contains('dark')?'sun':'moon')}</button><div class="flex -space-x-2"><div class="flex h-10 w-10 items-center justify-center overflow-hidden rounded-full border-2 border-white bg-gradient-to-br from-[#d9e8e5] to-[#a8c9c1] text-xs font-extrabold text-[#53736d]">${state.couple?.matvey_avatar?`<img src="${esc(state.couple.matvey_avatar)}" class="avatar-img h-full w-full">`:'М'}</div><div class="flex h-10 w-10 items-center justify-center overflow-hidden rounded-full border-2 border-white bg-gradient-to-br from-[#f4dce3] to-[#d795aa] text-xs font-extrabold text-berry">${state.couple?.ksyusha_avatar?`<img src="${esc(state.couple.ksyusha_avatar)}" class="avatar-img h-full w-full">`:'К'}</div></div></div></header>`}
function toggle(items,active,fn){return `<div class="flex rounded-2xl bg-[#f7edef] p-1">${items.map(x=>`<button onclick="${fn}('${x[0]}')" class="flex-1 rounded-xl px-2 py-2 text-sm font-bold ${active===x[0]?'bg-white text-berry shadow-sm':'text-[#9b8188]'}">${x[1]}</button>`).join('')}</div>`}
function home(){let body=header('Наш дом','Маленькие дела, которые делают нас ближе')+toggle([['shopping','Покупки'],['tasks','Дела'],['recipes','Рецепты']],state.home,'setHome');if(state.home==='shopping')body+=shopping();if(state.home==='tasks')body+=tasks();if(state.home==='recipes')body+=recipes();return body}
function shopping(){const chips=['Молоко','Хлеб','Яйца','Фрукты'];const groups=[['Продукты',state.items.filter(x=>(x.category||'products')==='products')],['Другие покупки',state.items.filter(x=>x.category==='other')]];return `<div class="mt-4 flex gap-2 overflow-x-auto px-5 hide-scroll">${chips.map(x=>`<button onclick="addItem('${x}','products')" class="whitespace-nowrap rounded-full bg-white px-4 py-2 text-sm font-semibold shadow-soft">＋ ${x}</button>`).join('')}</div><div class="space-y-4 px-5 pt-5">${groups.map(([title,arr])=>card(`<div class="mb-3 flex items-center justify-between"><h2 class="font-extrabold">${title}</h2><span class="text-xs text-[#a58f95]">${arr.length}</span></div>${arr.length?arr.map(itemRow).join(''):`<p class="text-sm text-[#b29da2]">Пока пусто</p>`}`,'')).join('')}</div>${addForm('Что нужно купить…','addItemPrompt()')}`}
function itemRow(x){return `<div class="flex items-center gap-3 border-t border-[#f6edef] py-3"><button onclick="update('items','${x.id}',{is_done:${!x.is_done}})" class="ios-check ${x.is_done?'is-done':''}">${x.is_done?'✓':''}</button><span class="flex-1 text-sm ${x.is_done?'text-[#b8a9ad] line-through':''}">${esc(x.title)}</span><button onclick="remove('items','${x.id}')" class="text-xl text-[#cdbac0]">×</button></div>`}
function tasks(){const arr=state.items.filter(x=>x.category==='task');return `<div class="space-y-3 px-5 pt-5">${card(arr.length?arr.map(x=>`<div class="flex items-center gap-3 border-b border-[#f6edef] py-3 last:border-0"><button onclick="update('items','${x.id}',{is_done:${!x.is_done}})" class="ios-check ${x.is_done?'is-done':''}">${x.is_done?'✓':''}</button><span class="flex-1 ${x.is_done?'line-through opacity-50':''}">${esc(x.title)}</span><span class="rounded-full bg-[#f9e6eb] px-2 py-1 text-xs text-berry">${esc(x.assigned_to||'Вместе')}</span></div>`).join(''):'<p class="text-sm text-[#a58f95]">Добавьте первое дело</p>')}</div>${addForm('Новое дело…','addTask()')}`}
function recipes(){let arr=state.recipes;return `<div class="space-y-3 px-5 pt-4">${card(`<button onclick="randomRecipe()" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-berry py-3 font-bold text-white">${icon('shuffle')} Случайный рецепт</button><input oninput="filterRecipes(this.value)" class="mt-3 w-full rounded-xl bg-[#fff7f8] px-4 py-3 outline-none" placeholder="Поиск рецепта…">`)}<div id="recipe-list">${arr.map(recipeCard).join('')}</div></div>`}
function recipeCard(x){return card(`<div class="flex items-start justify-between"><div><h3 class="font-extrabold">${esc(x.title)}</h3><p class="mt-1 text-sm text-[#927b82]">${esc(x.ingredients||'Ингредиенты не указаны')}</p></div><button onclick="update('recipes','${x.id}',{is_cooked:${!x.is_cooked}})" class="rounded-full px-3 py-2 text-xs font-bold ${x.is_cooked?'bg-berry text-white':'bg-[#f9e6eb] text-berry'}">${x.is_cooked?'Приготовлено':'Приготовить'}</button></div>`,'mt-3')}
function places(){const filtered=state.places.filter(x=>state.view==='all'||(state.view==='spontaneous'?x.tag==='spontaneous':x.tag==='planned'));return header('Места','Куда отправимся сегодня?')+`<div class="px-5">${card(`<button onclick="randomPlace()" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-berry py-3 font-bold text-white">${icon('shuffle')} Случайное место</button>`, 'mb-4')}${toggle([['all','Все'],['spontaneous','Спонтанное'],['planned','Запланированное']],state.view,'setView')}<div class="mt-4 space-y-3">${filtered.map(x=>card(`<div class="flex items-center gap-3"><span class="text-2xl">${x.tag==='spontaneous'?'⚡':'📍'}</span><div class="flex-1"><h3 class="font-bold">${esc(x.title)}</h3><p class="text-sm text-[#9b858b]">${esc(x.note||'')}</p></div><button onclick="remove('places','${x.id}')" class="text-xl text-[#cdbac0]">×</button></div>`)).join('')}</div></div>${addForm('Новая локация…','addPlace()')}`}
function daysTogether(){const d=state.couple?.start_date;if(!d)return 0;return Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/86400000))}
function lovePanel(){return card(`<div class="flex items-center justify-between"><div><p class="text-xs text-[#927b82]">Мы вместе</p><p class="text-2xl font-extrabold text-berry">${daysTogether()} дней</p></div><button onclick="sendWarmth(event)" class="rounded-2xl bg-berry px-4 py-3 text-sm font-bold text-white">Послать тепло ${icon('heart')}</button></div><p class="mt-2 text-xs text-[#927b82]">Тепло отправлено ${state.couple?.love_taps||0} раз</p>`)}
function couple(){const pet=state.couple||{};const mine=String(ALLOWED_IDS[1])===userId?'mood_user2':'mood_user1';const partner=mine==='mood_user1'?'mood_user2':'mood_user1';return header('Мы','Наше маленькое пространство')+`<div class="space-y-4 px-5">${lovePanel()}${statusBlock()}${card(`<div class="flex items-center gap-4"><div class="flex h-16 w-16 items-center justify-center rounded-full bg-[#ffe8a9] text-4xl">🦦</div><div class="flex-1"><h2 class="text-xl font-extrabold">${esc(pet.pet_name||'Бланшик')} <button onclick="renamePet()" class="ml-1 inline-flex align-middle text-[#b98d9b]">${icon('pencil')}</button></h2><p class="text-sm text-[#927b82]">Уровень ${Math.floor(Number(pet.pet_xp||0)/100)+1} · ${pet.pet_xp||0} XP</p></div><button onclick="feedPet()" class="rounded-xl bg-[#fff0c2] px-3 py-2 text-sm font-bold text-[#9b6812]">🍓 Покормить</button></div>`)}${card(`<h2 class="mb-3 font-extrabold">Настроение сегодня</h2><p class="text-sm font-bold">${userId===MATVEY_ID?'Матвей':'Ксюша'}: ${esc(pet[mine]||'—')}</p><div class="my-3 flex gap-2">${['Отлично','Норм','Грустно'].map(m=>`<button onclick="setMood('${m}')" class="rounded-xl px-3 py-2 text-sm ${pet[mine]===m?'bg-berry text-white':'bg-[#f9e6eb] text-berry'}">${m}</button>`).join('')}</div><p class="text-sm">Партнёр: ${esc(pet[partner]||'—')}</p>`)}</div>`}
function wishlist(){const mine=state.wishlist==='mine';const watching=state.view==='watch';const arr=state.wishlistItems.filter(x=>(String(x.owner_id)===userId)===mine&&(watching?x.category==='film':x.category!=='film'));return header('Вишлист','Маленькие желания')+`<div class="space-y-4 px-5">${toggle([['mine','Хочу я'],['partner','Хочет партнёр']],state.wishlist,'setWishlist')}${toggle([['wishes','Желания'],['watch','Посмотреть']],state.view,'setView')}${watching?card(`<button onclick="randomFilm()" class="w-full rounded-2xl bg-[#37262c] py-3 font-bold text-white">🎬 Случайный фильм</button>`):''}${arr.map(x=>card(`<div class="flex items-center gap-3"><span class="text-2xl">${watching?'🎬':'🎁'}</span><div class="flex-1"><h3 class="font-bold">${esc(x.title)}</h3></div>${mine?`<button aria-label="Удалить" onclick="remove('wishlist','${x.id}')" class="rounded-xl p-2 text-[#b98d9b]">${icon('trash')}</button>`:(!watching?`<button onclick="update('wishlist','${x.id}',{is_booked:${!x.is_booked}})" class="rounded-xl bg-[#f9e6eb] px-3 py-2 text-xs font-bold text-berry">${x.is_booked?'Забронировано':'Куплю я'}</button>`:'')}</div>`)).join('')||'<p class="text-center text-sm text-[#a58f95]">Список пока пуст</p>'}${mine?addForm(watching?'Новый фильм…':'Новое желание…','addWish()'):''}</div>`}
function settings(){return header('Настройки','Ваш доступ к приложению')+`<div class="space-y-4 px-5">${gameView()}${card(`<h2 class="font-extrabold">Пара</h2><label class="mt-3 block text-sm text-[#927b82]">Дата, когда вы стали вместе</label><input type="date" value="${state.couple?.start_date||''}" onchange="setStartDate(this.value)" class="mt-2 w-full rounded-xl bg-[#fff7f8] px-3 py-3"><label class="mt-3 flex cursor-pointer items-center justify-center gap-2 rounded-xl bg-[#f9e6eb] px-3 py-3 text-sm font-bold text-berry">${icon('pencil')} Загрузить свою аватарку<input type="file" accept="image/*" class="hidden" onchange="saveAvatar(this.files[0])"></label>`)}${card(`<p class="text-sm text-[#927b82]">Ваш Telegram ID</p><div class="mt-2 flex items-center gap-2"><code id="uid" class="flex-1 rounded-xl bg-[#fff6f7] px-3 py-3 font-mono text-sm">${userId||'Браузерный тест'}</code><button onclick="navigator.clipboard?.writeText('${userId}')" class="rounded-xl bg-[#f9e6eb] px-3 py-3 text-berry">Копировать</button></div>`)}${card(`<button onclick="load()" class="w-full rounded-2xl bg-berry py-3 font-bold text-white">↻ Обновить данные</button><p class="mt-3 text-xs text-[#a58f95]">${ALLOWED_IDS.length&&!ALLOWED_IDS.map(String).includes(userId)?'Доступ в браузере ограничен списком ID.':''}</p>`)}</div>`}
function addForm(ph,fn){return `<div class="fixed bottom-24 left-1/2 z-10 flex w-[calc(100%-40px)] max-w-xl -translate-x-1/2 gap-2 rounded-2xl bg-white/95 p-2 shadow-soft backdrop-blur"><input id="quick-input" class="min-w-0 flex-1 rounded-xl bg-[#fff7f8] px-3 py-2 outline-none" placeholder="${ph}"><button onclick="${fn}" class="rounded-xl bg-berry px-4 py-2 text-xl text-white">＋</button></div>`}
function nav(){return `<nav class="nav fixed bottom-0 left-0 right-0 z-20 mx-auto flex max-w-xl items-end justify-around"><button onclick="setTab('home')" class="flex flex-col items-center gap-1 text-xs font-bold ${state.tab==='home'?'text-berry':'text-[#b59da4]'}">${icon('home')}<span>Дом</span></button><button onclick="setTab('places')" class="flex flex-col items-center gap-1 text-xs font-bold ${state.tab==='places'?'text-berry':'text-[#b59da4]'}">${icon('map')}<span>Места</span></button><button onclick="setTab('couple')" class="heart-pulse -mt-7 flex h-16 w-16 flex-col items-center justify-center rounded-full bg-berry text-white">${icon('heart','h-7 w-7')}<span class="text-[10px] font-bold">Мы</span></button><button onclick="setTab('wishlist')" class="flex flex-col items-center gap-1 text-xs font-bold ${state.tab==='wishlist'?'text-berry':'text-[#b59da4]'}">${icon('gift')}<span>Вишлист</span></button><button onclick="setTab('settings')" class="flex flex-col items-center gap-1 text-xs font-bold ${state.tab==='settings'?'text-berry':'text-[#b59da4]'}">${icon('gear')}<span>Ещё</span></button></nav>`}
function render(){if(!accessGranted){document.querySelector('#app').innerHTML='<main class="flex min-h-screen items-center justify-center p-6"><section class="w-full max-w-sm rounded-[24px] bg-white p-7 text-center shadow-soft"><div class="mb-4 text-5xl">🔒</div><h1 class="text-2xl font-extrabold">Доступ закрыт</h1><p class="mt-3 text-sm text-[#927b82]">Этот Telegram ID не входит в список участников пары.</p><code class="mt-4 block rounded-xl bg-[#fff6f7] px-3 py-3 text-xs">'+esc(userId||'ID не определён')+'</code></section></main>';return}document.querySelector('#app').innerHTML=`<main class="page">${state.loading?'<div class="p-8 text-center text-[#a58f95]">Загружаем наше пространство…</div>':state.tab==='home'?home():state.tab==='places'?places():state.tab==='couple'?couple():state.tab==='wishlist'?wishlist():settings()}${nav()}</main>`;if(window.lucide)lucide.createIcons()}
window.setTab=t=>{state.tab=t;render()};window.setHome=x=>{state.home=x;render()};window.setView=x=>{state.view=x;render()};window.setWishlist=x=>{state.wishlist=x;render()};
window.addItem=(title,category)=>add('items',{title,type:'shopping',category,is_done:false,is_recurring:false});window.addItemPrompt=()=>{const x=document.querySelector('#quick-input');if(x?.value)addItem(x.value,'products')};window.addTask=()=>{const x=document.querySelector('#quick-input');if(x?.value)add('items',{title:x.value,type:'task',category:'task',is_done:false,is_recurring:false,assigned_to:meName})};window.addPlace=()=>{const x=document.querySelector('#quick-input');if(x?.value)add('places',{title:x.value,tag:'spontaneous',note:''})};window.addWish=()=>{const x=document.querySelector('#quick-input');if(x?.value)add('wishlist',{title:x.value,owner_id:userId,category:state.view==='watch'?'film':'gift',is_booked:false,is_gifted:false})};
window.filterRecipes=q=>{document.querySelector('#recipe-list').innerHTML=state.recipes.filter(x=>(x.title||'').toLowerCase().includes(q.toLowerCase())).map(recipeCard).join('')};window.randomRecipe=()=>{if(state.recipes.length){const x=state.recipes[Math.floor(Math.random()*state.recipes.length)];toast(`Сегодня готовим: ${x.title}`)}else toast(`Сегодня готовим: ${fallbackRecipes[Math.floor(Math.random()*fallbackRecipes.length)]}`)};window.randomPlace=()=>{if(state.places.length){const x=state.places[Math.floor(Math.random()*state.places.length)];toast(`Идём в: ${x.title}`)}};window.randomFilm=()=>{const films=state.wishlistItems.filter(x=>x.category==='film');toast(films.length?`Смотрим: ${films[Math.floor(Math.random()*films.length)].title}`:`Смотрим: ${fallbackFilms[Math.floor(Math.random()*fallbackFilms.length)]}`)};window.feedPet=async()=>{const p=state.couple||{};if(p.id)await update('couple_state',p.id,{pet_xp:Number(p.pet_xp||0)+10})};window.setMood=m=>{const p=state.couple||{};const col=String(ALLOWED_IDS[1])===userId?'mood_user2':'mood_user1';if(p.id)update('couple_state',p.id,{[col]:m,updated_at:dateNow()})};
initTheme();render();if(accessGranted){load();subscribe()}
</script>
</body>
</html>
