<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Мы — наше пространство</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>tailwind.config={theme:{extend:{colors:{berry:'#C82855',cream:'#FDF8F8'},boxShadow:{soft:'0 10px 30px rgba(80,35,48,.07)'}}}}</script>
  <style>
    *{box-sizing:border-box}body{background:#FDF8F8;color:#37262c;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{transition:transform .15s,opacity .15s}button:active{transform:scale(.96)}.page{padding-bottom:104px}.nav{padding-bottom:max(12px,env(safe-area-inset-bottom));}.hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{scrollbar-width:none}.heart-pulse{animation:pulse 2s infinite}@keyframes pulse{0%,100%{box-shadow:0 7px 20px #c8285550}50%{box-shadow:0 7px 30px #c8285590}}.toast{animation:toast .25s ease-out}@keyframes toast{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  </style>
</head>
<body>
  <div id="app" class="mx-auto min-h-screen max-w-xl"></div>
  <div id="toast" class="fixed bottom-28 left-1/2 z-50 hidden -translate-x-1/2 rounded-full bg-[#37262c] px-4 py-2 text-sm text-white shadow-lg"></div>
<script>
const SUPABASE_URL='https://ttmfyftblytlsmzukesk.supabase.co';
const SUPABASE_KEY='sb_publishable_14z1R07uloDUSZHxwoeoKw_PwqVP4uF';
const COUPLE_SECRET='skezz1488MQ';
const ALLOWED_IDS=[499383328,6085996678];
const tg=window.Telegram?.WebApp; tg?.ready();tg?.expand();
const userId=String(tg?.initDataUnsafe?.user?.id||'');
const meName=tg?.initDataUnsafe?.user?.first_name||'Я';
const accessGranted=!ALLOWED_IDS.length||ALLOWED_IDS.map(String).includes(userId);
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY,{global:{headers:{'x-couple-secret':COUPLE_SECRET}}});
const state={tab:'home',home:'shopping',wishlist:'mine',view:'watch',loading:true,items:[],recipes:[],wishlistItems:[],places:[],couple:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const icon=(name,cls='w-5 h-5')=>({home:'⌂',map:'⌖',heart:'♥',gift:'♡',gear:'⚙',plus:'＋',trash:'×',check:'✓',film:'▣',shuffle:'⤨',food:'♨',spark:'✦'}[name]||name);
function toast(msg){const x=document.querySelector('#toast');x.textContent=msg;x.classList.remove('hidden');x.classList.add('toast');setTimeout(()=>x.classList.add('hidden'),1800)}
function dateNow(){return new Date().toISOString()}
async function load(){if(!accessGranted)return;state.loading=true;render();const tables=['items','recipes','wishlist','places','couple_state'];const res=await Promise.all(tables.map(t=>db.from(t).select('*').order(t==='couple_state'?'updated_at':'created_at',{ascending:false})));[state.items,state.recipes,state.wishlistItems,state.places,state.couple]=res.map((r,i)=>i===4?(r.data?.[0]||{}):(r.data||[]));state.loading=false;render()}
function subscribe(){if(!accessGranted)return;db.channel('couple-live').on('postgres_changes',{event:'*',schema:'public'},()=>load()).subscribe()}
async function add(table,payload){if(!accessGranted)return;const {error}=await db.from(table).insert(payload);if(error)toast(error.message);else{toast('Сохранено');load()}}
async function update(table,id,payload){if(!accessGranted)return;const {error}=await db.from(table).update(payload).eq('id',id);if(error)toast(error.message);else load()}
async function remove(table,id){if(!accessGranted)return;const {error}=await db.from(table).delete().eq('id',id);if(error)toast(error.message);else load()}
function card(body,cls=''){return `<section class="rounded-[20px] bg-white p-4 shadow-soft ${cls}">${body}</section>`}
function header(title,sub=''){return `<header class="flex items-center justify-between px-5 pb-4 pt-7"><div><h1 class="text-2xl font-extrabold tracking-tight">${title}</h1>${sub?`<p class="mt-1 text-sm text-[#927b82]">${sub}</p>`:''}</div><div class="flex h-10 w-10 items-center justify-center rounded-full bg-[#f7dce4] text-xl text-berry">${icon(state.tab==='home'?'home':state.tab)}</div></header>`}
function toggle(items,active,fn){return `<div class="flex rounded-2xl bg-[#f7edef] p-1">${items.map(x=>`<button onclick="${fn}('${x[0]}')" class="flex-1 rounded-xl px-2 py-2 text-sm font-bold ${active===x[0]?'bg-white text-berry shadow-sm':'text-[#9b8188]'}">${x[1]}</button>`).join('')}</div>`}
function home(){let body=header('Наш дом','Маленькие дела, которые делают нас ближе')+toggle([['shopping','Покупки'],['tasks','Дела'],['recipes','Рецепты']],state.home,'setHome');if(state.home==='shopping')body+=shopping();if(state.home==='tasks')body+=tasks();if(state.home==='recipes')body+=recipes();return body}
function shopping(){const chips=['Молоко','Хлеб','Яйца','Фрукты'];const groups=[['Продукты',state.items.filter(x=>(x.category||'products')==='products')],['Другие покупки',state.items.filter(x=>x.category==='other')]];return `<div class="mt-4 flex gap-2 overflow-x-auto px-5 hide-scroll">${chips.map(x=>`<button onclick="addItem('${x}','products')" class="whitespace-nowrap rounded-full bg-white px-4 py-2 text-sm font-semibold shadow-soft">＋ ${x}</button>`).join('')}</div><div class="space-y-4 px-5 pt-5">${groups.map(([title,arr])=>card(`<div class="mb-3 flex items-center justify-between"><h2 class="font-extrabold">${title}</h2><span class="text-xs text-[#a58f95]">${arr.length}</span></div>${arr.length?arr.map(itemRow).join(''):`<p class="text-sm text-[#b29da2]">Пока пусто</p>`}`,'')).join('')}</div>${addForm('Что нужно купить…','addItemPrompt()')}`}
function itemRow(x){return `<div class="flex items-center gap-3 border-t border-[#f6edef] py-3"><button onclick="update('items','${x.id}',{is_done:${!x.is_done}})" class="flex h-6 w-6 items-center justify-center rounded-full border-2 ${x.is_done?'border-berry bg-berry text-white':'border-[#e8cfd6]'}">${x.is_done?'✓':''}</button><span class="flex-1 text-sm ${x.is_done?'text-[#b8a9ad] line-through':''}">${esc(x.title)}</span><button onclick="remove('items','${x.id}')" class="text-xl text-[#cdbac0]">×</button></div>`}
function tasks(){const arr=state.items.filter(x=>x.category==='task');return `<div class="space-y-3 px-5 pt-5">${card(arr.length?arr.map(x=>`<div class="flex items-center gap-3 border-b border-[#f6edef] py-3 last:border-0"><button onclick="update('items','${x.id}',{is_done:${!x.is_done}})" class="h-6 w-6 rounded-full border-2 ${x.is_done?'border-berry bg-berry text-white':''}">${x.is_done?'✓':''}</button><span class="flex-1 ${x.is_done?'line-through opacity-50':''}">${esc(x.title)}</span><span class="rounded-full bg-[#f9e6eb] px-2 py-1 text-xs text-berry">${esc(x.assigned_to||'Вместе')}</span></div>`).join(''):'<p class="text-sm text-[#a58f95]">Добавьте первое дело</p>')}</div>${addForm('Новое дело…','addTask()')}`}
function recipes(){let arr=state.recipes;return `<div class="space-y-3 px-5 pt-4">${card(`<button onclick="randomRecipe()" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-berry py-3 font-bold text-white">${icon('shuffle')} Случайный рецепт</button><input oninput="filterRecipes(this.value)" class="mt-3 w-full rounded-xl bg-[#fff7f8] px-4 py-3 outline-none" placeholder="Поиск рецепта…">`)}<div id="recipe-list">${arr.map(recipeCard).join('')}</div></div>`}
function recipeCard(x){return card(`<div class="flex items-start justify-between"><div><h3 class="font-extrabold">${esc(x.title)}</h3><p class="mt-1 text-sm text-[#927b82]">${esc(x.ingredients||'Ингредиенты не указаны')}</p></div><button onclick="update('recipes','${x.id}',{is_cooked:${!x.is_cooked}})" class="rounded-full px-3 py-2 text-xs font-bold ${x.is_cooked?'bg-berry text-white':'bg-[#f9e6eb] text-berry'}">${x.is_cooked?'Приготовлено':'Приготовить'}</button></div>`,'mt-3')}
function places(){const filtered=state.places.filter(x=>state.view==='all'||(state.view==='spontaneous'?x.tag==='spontaneous':x.tag==='planned'));return header('Места','Куда отправимся сегодня?')+`<div class="px-5">${card(`<button onclick="randomPlace()" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-berry py-3 font-bold text-white">${icon('shuffle')} Случайное место</button>`, 'mb-4')}${toggle([['all','Все'],['spontaneous','Спонтанное'],['planned','Запланированное']],state.view,'setView')}<div class="mt-4 space-y-3">${filtered.map(x=>card(`<div class="flex items-center gap-3"><span class="text-2xl">${x.tag==='spontaneous'?'⚡':'📍'}</span><div class="flex-1"><h3 class="font-bold">${esc(x.title)}</h3><p class="text-sm text-[#9b858b]">${esc(x.note||'')}</p></div><button onclick="remove('places','${x.id}')" class="text-xl text-[#cdbac0]">×</button></div>`)).join('')}</div></div>${addForm('Новая локация…','addPlace()')}`}
function couple(){const pet=state.couple||{};const mine=String(ALLOWED_IDS[1])===userId?'mood_user2':'mood_user1';const partner=mine==='mood_user1'?'mood_user2':'mood_user1';return header('Мы','Наше маленькое пространство')+`<div class="space-y-4 px-5">${card(`<div class="flex items-center gap-4"><div class="flex h-16 w-16 items-center justify-center rounded-full bg-[#ffe8a9] text-4xl">🦦</div><div class="flex-1"><h2 class="text-xl font-extrabold">${esc(pet.pet_name||'Выдра Плюша')}</h2><p class="text-sm text-[#927b82]">Уровень ${Math.floor(Number(pet.pet_xp||0)/100)+1} · ${pet.pet_xp||0} XP</p></div><button onclick="feedPet()" class="rounded-xl bg-[#fff0c2] px-3 py-2 text-sm font-bold text-[#9b6812]">🍓 Покормить</button></div>`)}${card(`<h2 class="mb-3 font-extrabold">Настроение сегодня</h2><p class="text-sm font-bold">${esc(meName)}: ${esc(pet[mine]||'—')}</p><div class="my-3 flex gap-2">${['Отлично','Норм','Грустно'].map(m=>`<button onclick="setMood('${m}')" class="rounded-xl px-3 py-2 text-sm ${pet[mine]===m?'bg-berry text-white':'bg-[#f9e6eb] text-berry'}">${m}</button>`).join('')}</div><p class="text-sm">Партнёр: ${esc(pet[partner]||'—')}</p>`)}</div>`}
function wishlist(){const mine=state.wishlist==='mine';const watching=state.view==='watch';const arr=state.wishlistItems.filter(x=>(String(x.owner_id)===userId)===mine&&(watching?x.category==='film':x.category!=='film'));return header('Вишлист','Маленькие желания')+`<div class="space-y-4 px-5">${toggle([['mine','Хочу я'],['partner','Хочет партнёр']],state.wishlist,'setWishlist')}${toggle([['wishes','Желания'],['watch','Посмотреть']],state.view,'setView')}${watching?card(`<button onclick="randomFilm()" class="w-full rounded-2xl bg-[#37262c] py-3 font-bold text-white">🎬 Случайный фильм</button>`):''}${arr.map(x=>card(`<div class="flex items-center gap-3"><span class="text-2xl">${watching?'🎬':'🎁'}</span><div class="flex-1"><h3 class="font-bold">${esc(x.title)}</h3></div>${!mine&&!watching?`<button onclick="update('wishlist','${x.id}',{is_booked:${!x.is_booked}})" class="rounded-xl bg-[#f9e6eb] px-3 py-2 text-xs font-bold text-berry">${x.is_booked?'Забронировано':'Забронировать подарок'}</button>`:''}</div>`)).join('')||'<p class="text-center text-sm text-[#a58f95]">Список пока пуст</p>'}${mine?addForm(watching?'Новый фильм…':'Новое желание…','addWish()'):''}</div>`}
function settings(){return header('Настройки','Ваш доступ к приложению')+`<div class="space-y-4 px-5">${card(`<p class="text-sm text-[#927b82]">Ваш Telegram ID</p><div class="mt-2 flex items-center gap-2"><code id="uid" class="flex-1 rounded-xl bg-[#fff6f7] px-3 py-3 font-mono text-sm">${userId||'Браузерный тест'}</code><button onclick="navigator.clipboard?.writeText('${userId}')" class="rounded-xl bg-[#f9e6eb] px-3 py-3 text-berry">Копировать</button></div>`)}${card(`<button onclick="load()" class="w-full rounded-2xl bg-berry py-3 font-bold text-white">↻ Обновить данные</button><p class="mt-3 text-xs text-[#a58f95]">${ALLOWED_IDS.length&&!ALLOWED_IDS.map(String).includes(userId)?'Доступ в браузере ограничен списком ID.':''}</p>`)}</div>`}
function addForm(ph,fn){return `<div class="fixed bottom-24 left-1/2 z-10 flex w-[calc(100%-40px)] max-w-xl -translate-x-1/2 gap-2 rounded-2xl bg-white/95 p-2 shadow-soft backdrop-blur"><input id="quick-input" class="min-w-0 flex-1 rounded-xl bg-[#fff7f8] px-3 py-2 outline-none" placeholder="${ph}"><button onclick="${fn}" class="rounded-xl bg-berry px-4 py-2 text-xl text-white">＋</button></div>`}
function nav(){return `<nav class="nav fixed bottom-0 left-0 right-0 z-20 mx-auto flex max-w-xl items-end justify-around border-t border-[#f5e6e9] bg-white/95 px-3 pt-3 shadow-[0_-8px_25px_rgba(80,35,48,.06)] backdrop-blur"><button onclick="setTab('home')" class="flex flex-col items-center gap-1 text-xs font-bold ${state.tab==='home'?'text-berry':'text-[#b59da4]'}">⌂<span>Дом</span></button><button onclick="setTab('places')" class="flex flex-col items-center gap-1 text-xs font-bold ${state.tab==='places'?'text-berry':'text-[#b59da4]'}">⌖<span>Места</span></button><button onclick="setTab('couple')" class="heart-pulse -mt-7 flex h-16 w-16 flex-col items-center justify-center rounded-full bg-berry text-2xl text-white">♥<span class="text-[10px] font-bold">Мы</span></button><button onclick="setTab('wishlist')" class="flex flex-col items-center gap-1 text-xs font-bold ${state.tab==='wishlist'?'text-berry':'text-[#b59da4]'}">♡<span>Вишлист</span></button><button onclick="setTab('settings')" class="flex flex-col items-center gap-1 text-xs font-bold ${state.tab==='settings'?'text-berry':'text-[#b59da4]'}">⚙<span>Ещё</span></button></nav>`}
function render(){if(!accessGranted){document.querySelector('#app').innerHTML='<main class="flex min-h-screen items-center justify-center p-6"><section class="w-full max-w-sm rounded-[24px] bg-white p-7 text-center shadow-soft"><div class="mb-4 text-5xl">🔒</div><h1 class="text-2xl font-extrabold">Доступ закрыт</h1><p class="mt-3 text-sm text-[#927b82]">Этот Telegram ID не входит в список участников пары.</p><code class="mt-4 block rounded-xl bg-[#fff6f7] px-3 py-3 text-xs">'+esc(userId||'ID не определён')+'</code></section></main>';return}document.querySelector('#app').innerHTML=`<main class="page">${state.loading?'<div class="p-8 text-center text-[#a58f95]">Загружаем наше пространство…</div>':state.tab==='home'?home():state.tab==='places'?places():state.tab==='couple'?couple():state.tab==='wishlist'?wishlist():settings()}${nav()}</main>`}
window.setTab=t=>{state.tab=t;render()};window.setHome=x=>{state.home=x;render()};window.setView=x=>{state.view=x;render()};window.setWishlist=x=>{state.wishlist=x;render()};
window.addItem=(title,category)=>add('items',{title,type:'shopping',category,is_done:false,is_recurring:false});window.addItemPrompt=()=>{const x=document.querySelector('#quick-input');if(x?.value)addItem(x.value,'products')};window.addTask=()=>{const x=document.querySelector('#quick-input');if(x?.value)add('items',{title:x.value,type:'task',category:'task',is_done:false,is_recurring:false,assigned_to:meName})};window.addPlace=()=>{const x=document.querySelector('#quick-input');if(x?.value)add('places',{title:x.value,tag:'spontaneous',note:''})};window.addWish=()=>{const x=document.querySelector('#quick-input');if(x?.value)add('wishlist',{title:x.value,owner_id:userId,category:state.view==='watch'?'film':'gift',is_booked:false,is_gifted:false})};
window.filterRecipes=q=>{document.querySelector('#recipe-list').innerHTML=state.recipes.filter(x=>(x.title||'').toLowerCase().includes(q.toLowerCase())).map(recipeCard).join('')};window.randomRecipe=()=>{if(state.recipes.length){const x=state.recipes[Math.floor(Math.random()*state.recipes.length)];toast(`Сегодня готовим: ${x.title}`)}};window.randomPlace=()=>{if(state.places.length){const x=state.places[Math.floor(Math.random()*state.places.length)];toast(`Идём в: ${x.title}`)}};window.randomFilm=()=>{const films=state.wishlistItems.filter(x=>x.category==='film');toast(films.length?`Смотрим: ${films[Math.floor(Math.random()*films.length)].title}`:'Добавьте фильмы в список')};window.feedPet=async()=>{const p=state.couple||{};if(p.id)await update('couple_state',p.id,{pet_xp:Number(p.pet_xp||0)+10})};window.setMood=m=>{const p=state.couple||{};const col=String(ALLOWED_IDS[1])===userId?'mood_user2':'mood_user1';if(p.id)update('couple_state',p.id,{[col]:m,updated_at:dateNow()})};
render();if(accessGranted){load();subscribe()}
</script>
</body>
</html>
